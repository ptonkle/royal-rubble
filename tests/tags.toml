# Which check steps a change to which files needs. Read by scripts/quick_check.py.
#
# Each [[rule]] names the files it covers (globs, from the project's root;
# ** crosses folders) and the steps of ./scripts/check.sh a change to them
# must run. A changed file that no rule covers runs the whole check, and the
# guard (quick_check.py --guard, run by check.sh) fails while any file in the
# project is covered by no rule, so a new file gets a rule when it is added.
# When unsure, give a file the wider rule: a quick check is only as safe as
# its rules. ./scripts/check.sh stays the check before a handoff or a deploy.
#
# Steps: fmt, clippy, core, build, wasm, art, notebook, journal, browser, all.
# After Peter's quick check in Ape Race, Honey Hole and Crabble; ported with
# its test tags from Fleeced (R1.405).

ignore = [".gitignore", "notes/**", ".claude/**", "LICENSE*", "README.md", "LICENSES.md", "MEASUREMENTS.md", "DECISIONS.md"]

# Test tags. A [[rule]] says which check steps a file needs; a rule that also
# names `tags` narrows the core step to the cargo tests whose [tests] tags
# meet them (scripts/tags.py). A file no tagged rule covers runs every test,
# so a rule with no tags stays safe. scripts/check.sh's tags step fails on a
# test with no tags, so add a row below with each new module.

[tags]
all = "foundations: run everything"
boundary = "the architecture scans of tests/boundary.rs (always run: they read every file)"
foundation = "rng.rs, ticks.rs: no rule tags them, so a change to one runs everything"
online = "the lobby and online play: lobby.rs, online.rs, online/, the transport's fence"
page = "the app and its door: app.rs, api.rs, view.rs, icon.rs, the shim, web/"
saves = "the save and the settings it keeps: save.rs, the storage fence"
notes = "the version and What's New: patch_notes.rs, data/patch-notes.json"
copy = "reader-visible words: GLOSSARY.md, TONE.md, data/strings.json, strings.rs, glossary.rs"
ai = "bot aiming and castle plans: crates/core/src/ai/"
upgrades = "upgrade cards and what they do: game/upgrades.rs, data/upgrades.json, the upgrade rules in game/flow.rs"
ammo = "ammo kinds, blasts and strength bonuses: physics/ammo.rs"
match = "the match glue: play/ (build, siege, units) and its probe"
field = "the playfield and sandbox: app/field.rs, app/sandbox*, web/field*.js, web/field.css, data/field.json"
game = "the rules: game/ (flow, economy, ledger, royals, pairing, bots, sites)"
physics = "the physics: physics/ and its probe"
terrain = "the terrain: terrain/ and its pictures"
arena = "the match screen: crates/core/src/app/arena.rs"
sound = "the sound data: crates/core/tests/sound.rs reads data/sound*.json"

# A hit tag on the left also hits the tags on the right, transitively.
[implies]
online = ["page"]
saves = ["page"]
notes = ["page"]
copy = ["page"]

# Tags whose tests always run in a quick check.
[always]
tags = ["boundary"]

# Test id prefix -> tags. `lib:<module>` is the core's own tests, and
# `test:<file>` an integration test file's. The longest prefix wins.
[tests]
"test:boundary" = ["boundary"]
"test:copy" = ["copy"]
"test:storage_fence" = ["saves"]
"test:online_fence" = ["online"]
"lib:api" = ["page"]
"lib:app" = ["page"]
"lib:app::field" = ["field"]
"lib:app::sandbox" = ["field"]
"lib:icon" = ["page"]
"lib:view" = ["page"]
"lib:lobby" = ["online"]
"lib:online" = ["online"]
"lib:save" = ["saves"]
"lib:patch_notes" = ["notes"]
"lib:glossary" = ["copy"]
"lib:strings" = ["copy"]
"lib:rng" = ["foundation"]
"lib:ticks" = ["foundation"]
"lib:ai" = ["ai"]
"test:ai_probe" = ["ai"]
"lib:game::upgrades" = ["upgrades"]
"lib:physics::ammo" = ["ammo"]
"lib:game::flow::tests::round_upgrades_pay_at_build_start" = ["upgrades"]
"lib:game::flow::tests::secret_passage_spares_the_first_death_and_pardon_cuts_the_rest" = ["upgrades"]
"lib:game::flow::tests::vengeance_and_scavenger_add_shots_next_round" = ["upgrades"]
"lib:game::flow::tests::long_arm_and_spare_stones_change_the_loadout" = ["upgrades"]
"lib:game::flow::tests::quartermaster_makes_bought_shots_cost_one" = ["upgrades"]
"lib:play" = ["match"]
"lib:play::tests::ruins_stand_under_the_static_test_on_every_seed" = ["match", "terrain"]
"lib:play::tests::trebuchet_best_throw_lands_just_past_the_farthest_plot_back" = ["match", "terrain"]
"lib:play::tests::trebuchet_level_one_castle_box_window_is_at_least_24_ticks" = ["match", "terrain"]
"lib:ai::tests::ai_bot_castle_grows_every_round_and_stands" = ["ai", "match"]
"lib:ai::tests::ai_bot_royal_figures_fit_under_their_cover" = ["ai", "field"]
"lib:ai::tests::ai_botplan_bot_waits_for_each_planned_shot" = ["ai", "match"]
"lib:play::tests::botplan_build_planning_is_kept_when_the_castle_stands_as_planned" = ["ai", "match"]
"lib:play::tests::botplan_build_planning_starts_again_when_the_castle_changed" = ["ai", "match"]
"lib:play::online" = ["online"]
"lib:app::tests::online" = ["online"]
"lib:app::arena" = ["arena"]
"lib:app::arena::tests::arena_the_view_keeps_the_trebuchet_in_just_after_release" = ["arena", "physics"]
"test:play_probe" = ["match"]
"lib:game" = ["game"]
"lib:physics" = ["physics"]
"lib:terrain" = ["terrain"]
"test:physics_probe" = ["physics"]
"test:terrain_pictures" = ["terrain"]
"test:sound" = ["sound"]

[[rule]]
name = "the core and the shim"
files = ["crates/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml"]
steps = ["fmt", "clippy", "core", "build", "wasm", "browser"]

[[rule]]
name = "the page and its data"
# the boundary and copy tests read web/ and data/, so the core suite runs too
files = ["web/**", "data/**"]
steps = ["core", "build", "wasm", "browser"]

[[rule]]
name = "the words"
files = ["GLOSSARY.md", "TONE.md"]
steps = ["core"]

[[rule]]
name = "the art pipeline"
files = ["styles/**", "tools/art/**", "tests/art_check.py"]
steps = ["art"]

[[rule]]
name = "the records"
files = ["BRIEF.md", "PLAN.md", "SECOND-ORDER.md", "TRIAGE.md", "HANDOFF.md", "CLAUDE.md", "AGENTS.md", "BUILDER-SPEC.md"]
steps = ["notebook", "journal"]

[[rule]]
name = "the journal's tools"
files = ["tools/journal/**", "scripts/journal_check.py"]
steps = ["journal"]

[[rule]]
name = "the browser check"
files = ["tests/browser/**"]
steps = ["build", "browser"]

[[rule]]
name = "the breaks"
files = ["tests/breaks.json", "scripts/break_tests.py"]
steps = ["core"]
tags = ["boundary"]

[[rule]]
name = "the checks themselves"
# a change to a script that runs or builds the checks runs everything
files = ["scripts/**", "tests/tags.toml"]
steps = ["all"]

# The narrow rules: each adds nothing to the steps above, and says which tests
# its files reach.

[[rule]]
name = "tests of the lobby and online play"
files = ["crates/core/src/lobby.rs", "crates/core/src/online.rs", "crates/core/src/online/**", "crates/core/src/play/online.rs", "crates/core/src/play/online_tests.rs", "tests/browser/online.py", "crates/core/tests/online_fence.rs", "web/online.js", "web/net-clock.js", "web/net/**"]
steps = ["core"]
tags = ["online"]

[[rule]]
name = "tests of the app and its door"
files = ["crates/core/src/api.rs", "crates/core/src/app.rs", "crates/core/src/app/**", "crates/core/src/icon.rs", "crates/core/src/view.rs", "crates/shim/**", "web/app.js", "web/index.html", "web/style.css", "web/theme.css", "web/settings.js"]
steps = ["core"]
tags = ["page"]

[[rule]]
name = "tests of the save"
files = ["crates/core/src/save.rs", "crates/core/tests/storage_fence.rs", "web/save/**"]
steps = ["core"]
tags = ["saves"]

[[rule]]
name = "tests of the version"
files = ["crates/core/src/patch_notes.rs", "data/patch-notes.json"]
steps = ["core"]
tags = ["notes"]

[[rule]]
name = "tests of the words"
files = ["crates/core/src/glossary.rs", "crates/core/src/strings.rs", "crates/core/tests/copy.rs", "data/strings.json", "GLOSSARY.md", "TONE.md"]
steps = ["core"]
tags = ["copy"]
[[rule]]
name = "tests of the bot intelligence"
files = ["crates/core/src/ai/**", "crates/core/tests/ai_probe.rs"]
steps = ["core"]
tags = ["ai"]

[[rule]]
name = "the sound tools"
# they write data/sound*.json, which crates/core/tests/sound.rs reads
files = ["tools/sound/**"]
steps = ["core"]

[[rule]]
name = "tests of the upgrades"
files = ["crates/core/src/game/upgrades.rs", "data/upgrades.json"]
steps = ["core"]
tags = ["upgrades"]

[[rule]]
name = "tests of the ammo"
files = ["crates/core/src/physics/ammo.rs"]
steps = ["core"]
tags = ["ammo"]

[[rule]]
name = "tests of the match glue"
# game/, physics/ and terrain/ stay on the wide core rule: play's tests read them
files = ["crates/core/src/play/**", "crates/core/tests/play_probe.rs"]
steps = ["core"]
tags = ["match"]

[[rule]]
name = "tests of the playfield"
files = ["crates/core/src/app/field.rs", "crates/core/src/app/sandbox.rs", "crates/core/src/app/sandbox/**", "web/field.js", "web/field-draw.js", "web/treb-draw.js", "web/field.css", "data/field.json", "data/stitch.json", "data/palette.json", "data/stitch-sprites.json", "data/look/**", "tools/look/stitch.js", "tools/look/bake.html", "tools/look/bake_stitch.py"]
steps = ["core"]
tags = ["field"]

[[rule]]
name = "the menu art generator"
# it writes web/look/*.svg, which the page rule covers
files = ["tools/look/**"]
steps = []

[[rule]]
name = "tests of the match screen"
files = ["crates/core/src/app/arena.rs", "crates/core/src/app/arena/**", "scripts/play_match.py", "scripts/play_late.py"]
steps = ["core"]
tags = ["arena"]
